name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # The branch in sushimist-web that triggers the deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Standard GitHub Actions runner

    steps:
      - name: Checkout sushimist-web repository
        uses: actions/checkout@v4 # Clones diegoaep07/sushimist-web

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your Node.js version (e.g., '18', '20', '22')
          cache: 'npm' # Enable npm package caching

      - name: Install dependencies
        run: npm ci # Use npm ci for clean installs in CI environments

      - name: Run custom deploy build script
        # This executes the 'deploy:build' script from package.json,
        # which includes fetching config/assets, building, and cleanup.
        run: npm run deploy:build

      - name: Deploy to GitHub Pages
        run: |
          # Navigate to the built output directory
          cd dist

          # Initialize Git in the dist directory
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy from sushimist-web" || true # '|| true' allows the commit to pass even if no changes
          
          # Force push to the external repository using the PAT
          # The PAT is passed via the URL for authentication
          git push --force "https://sushimist-menu:${{ secrets.GH_TOKEN }}@github.com/sushimist-menu/sushimist-menu.github.io.git" main:main
        env:
          # Explicitly set the GITHUB_TOKEN environment variable for this step
          # This ensures the PAT is available if needed by any underlying git commands
          # Although, in this direct push, it's primarily used in the URL.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
