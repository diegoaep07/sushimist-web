backend: 
  name: github
  repo: diegoaep07/sushimist-web

collections:
  - name: "menu" # Used in routes, e.g., /admin/collections/blog
    label: "Menu" # Used in the UI
    folder: "src/assets/menu_elements" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}"
    fields: # The fields for each document, usually in frontmatter
      - { label: "Layout", name: "layout", widget: "hidden", default: "menu" }
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Descripción", name: "description", widget: "markdown" }
      - { label: "Imagen", name: "image", widget: "image" }
      - { label: "Recomendado", name: "recomended", widget: "boolean" }
      - { label: "Disponibilidad", name: "available", widget: "boolean" }
      - { label: "Precio", name: "price", widget: "number" }

media_folder: "src/assets/menu"

